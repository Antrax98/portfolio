services:
  - type: web
    name: portfolio-api
    runtime: node
    plan: free
    region: oregon
    # Sin corepack enable: la imagen de build ya trae pnpm en /usr/bin, que es
    # de solo lectura, y corepack falla al intentar reemplazarlo (EROFS).
    # Las dos apps son proyectos de pnpm independientes, cada una con su
    # lockfile: los filtros del workspace no resuelven nada y salen con exito
    # sin construir. rootDir entra directo en la carpeta.
    rootDir: apps/nest-backend
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    # Las migraciones van aqui y no en un preDeployCommand, que es solo para
    # instancias de pago. Es idempotente: en cada arranque aplica las que falten.
    startCommand: pnpm migration:run && pnpm start:prod
    healthCheckPath: /api
    buildFilter:
      paths:
        - apps/nest-backend/**
    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: "10000"

      - key: DB_HOST
        fromDatabase:
          name: portfolio-db
          property: host

      - key: DB_PORT
        fromDatabase:
          name: portfolio-db
          property: port

      - key: DB_USER
        fromDatabase:
          name: portfolio-db
          property: user

      - key: DB_PASS
        fromDatabase:
          name: portfolio-db
          property: password

      - key: DB_NAME
        fromDatabase:
          name: portfolio-db
          property: database

      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: "1h"

      - key: THROTTLE_TTL
        value: "60000"

      - key: THROTTLE_LIMIT
        value: "100"

  - type: web
    name: portfolio-web
    runtime: node
    plan: free
    region: oregon
    rootDir: apps/next-frontend
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    buildFilter:
      paths:
        - apps/next-frontend/**
    envVars:
      # La URL publica de la api, del tipo https://portfolio-api-XXXX.onrender.com
      #
      # No vale la red privada: un servicio web del plan free puede mandar
      # peticiones internas pero no recibirlas, asi que http://portfolio-api:10000
      # da 503. Y el sufijo aleatorio no se sabe hasta que Render crea el
      # servicio, de ahi el sync: false en vez de un valor fijo.
      #
      # No expone nada nuevo: con el patron BFF a la api solo la llama el
      # servidor de Next, nunca el navegador.
      - key: BACKEND_URL
        sync: false

databases:
  - name: portfolio-db
    plan: free
    region: oregon
    databaseName: portfolio
    user: portfolio
